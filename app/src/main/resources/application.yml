# List of common application properties:
# https://docs.spring.io/spring-boot/docs/current/reference/htmlsingle/#common-application-properties
server:
  port: 9080
  address: 0.0.0.0

logging:
  level:
    org.springframework.web: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"
  observations:
    enable:
      # The Spring Security observations carry no request path, so the untraced-paths predicate in
      # TracingConfig cannot drop them: re-enabling this puts orphaned security spans for every
      # probe and scrape back into the traces.
      spring.security: false
  tracing:
    export:
      enabled: ${TRACING_ENABLED:true}
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # OTLP over HTTP/protobuf (default collector port 4318). Defaults are needed even
          # when export is disabled: Boot resolves this placeholder while evaluating the
          # exporter's @ConditionalOnProperty, so an unset COLLECTOR_HOST fails startup.
          endpoint: ${COLLECTOR_HOST:http://localhost}:${COLLECTOR_PORT:4318}/v1/traces

spring:
  application:
    name: ${APPLICATION_NAME:portal-ng-bff}
  reactor:
    # Restores the MDC (traceId, spanId) on whichever thread a reactive operator runs, so log
    # lines written inside a WebFlux or WebClient chain carry the ids of the request's span.
    context-propagation: auto
  security:
    oauth2:
      client:
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
            jwk-set-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
        registration:
          keycloak:
            provider: keycloak
            client-id: ${KEYCLOAK_CLIENT_ID}
            client-secret: ${KEYCLOAK_CLIENT_SECRET}
            authorization-grant-type: client_credentials
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

bff:
  realm: ${KEYCLOAK_REALM}
  preferences-url: ${PREFERENCES_URL}
  history-url: ${HISTORY_URL}
  keycloak-url: ${KEYCLOAK_URL}
  keycloak-client-id: ${KEYCLOAK_CLIENT_ID}
  endpoints:
    unauthenticated: /api-docs.html, /api.yaml, /webjars/**, /actuator/**

  tracing:
    untraced-paths-enabled: true

  rbac:
    endpoints-excluded: ${RBAC_EXCLUDED_ENDPOINTS:/api-docs.html, /api.yaml, /webjars/**, /actuator/**}
