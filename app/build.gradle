plugins {
	id 'java'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
    id 'com.gorylenko.gradle-git-properties' // commit information in actuator
    id 'jacoco'                              // code coverage
    id 'com.diffplug.spotless'
}

group = 'org.onap.portalng'

// Boot 4's BOM manages Groovy 5, but rest-assured 5.5.7 is built against Groovy 4 and its Groovy
// internals throw a NullPointerException on 5 (Class.isAssignableFrom(null) inside
// RequestSpecificationImpl.sendHttpRequest). Hold Groovy at 4 until rest-assured supports 5.
ext['groovy.version'] = '4.0.22'

java {
	sourceCompatibility = JavaVersion.VERSION_17
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

dependencies {
	implementation project(':openapi:server')
    implementation project(':openapi:client-history')
    implementation project(':openapi:client-preferences')
    implementation project(':openapi:client-keycloak')
	implementation project(':lib')

	implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'tools.jackson.dataformat:jackson-dataformat-xml'

    implementation "org.mapstruct:mapstruct:$mapStructVersion"
    annotationProcessor "org.mapstruct:mapstruct-processor:$mapStructVersion"
    implementation "org.mapstruct.extensions.spring:mapstruct-spring-annotations:$mapStructExtensionsVersion"
    implementation "org.mapstruct.extensions.spring:mapstruct-spring-extensions:$mapStructExtensionsVersion"

    implementation "org.springframework.boot:spring-boot-starter-logging"
    implementation "net.logstash.logback:logstash-logback-encoder:$logbackVersion"
    compileOnly             "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor     "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:$lombokMapStructBindingVersion"
    testCompileOnly         "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"

    testImplementation 'io.projectreactor:reactor-test'
    testImplementation "org.springframework.cloud:spring-cloud-contract-wiremock:$wiremockVersion"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "io.rest-assured:rest-assured:$restAssuredVersion"
    // rest-assured deserializes response bodies with Jackson 2 (JsonPathJackson2ObjectDeserializer),
    // and Boot 4 no longer puts Jackson 2's java-time module on the classpath, so any DTO with an
    // OffsetDateTime fails with "Java 8 date/time type not supported by default".
    testImplementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
}

tasks.named('test') {
	useJUnitPlatform()
}

test.finalizedBy jacocoTestReport
jacocoTestReport {
    reports {
        xml.required = true
    }
}

spotless {
    java {
        removeUnusedImports()
        trimTrailingWhitespace()
        googleJavaFormat('1.15.0')
    }
}
tasks.withType(JavaCompile) {
    dependsOn 'spotlessApply'
}
