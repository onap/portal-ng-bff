plugins {
    // Spotless 8 + Gradle 9: the plugin is applied in both :lib and :app, and its
    // SpotlessTaskService build service cannot be shared across two sibling project
    // classloader scopes. Declaring it here (without applying it) puts it on the root
    // scope so both subprojects resolve the same service class.
    id 'com.diffplug.spotless' apply false
}

allprojects {
  repositories {
	  mavenCentral()
  }
}

ext {
    // app + lib
    mapStructVersion = '1.6.3'
    mapStructExtensionsVersion = '1.0.2'
    logbackVersion = '7.4'
    lombokVersion = '1.18.46'
    swaggerV3Version = '2.2.21'
    lombokMapStructBindingVersion = '0.2.0'

    // app
    wiremockVersion = '4.0.4'
}
