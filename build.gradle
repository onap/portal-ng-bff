allprojects {
  repositories {
	  mavenCentral()
  }
}

ext {
    // app + lib
    mapStructVersion = '1.6.3'
    mapStructExtensionsVersion = '1.0.2'
    logbackVersion = '7.4'
    lombokVersion = '1.18.46'
    swaggerV3Version = '2.2.21'
    lombokMapStructBindingVersion = '0.2.0'

    // app
    wiremockVersion = '5.0.3'
    // Spring Boot 4's BOM no longer manages rest-assured, so pin it here.
    restAssuredVersion = '5.5.7'
}
